services:
  db:
    image: postgres:16-alpine
    container_name: mediconnect-db
    environment:
      POSTGRES_DB: mediconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  monolith:
    build:
      context: ../monolith
      dockerfile: Dockerfile
    container_name: mediconnect-monolith
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=mediconnect;Username=postgres;Password=${POSTGRES_PASSWORD:-password}
      - Jwt__Key=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in docker/.env}
      - Jwt__Issuer=MediConnect
      - Jwt__Audience=MediConnectUsers
      - Jwt__DurationInMinutes=60
      - AiService__Url=http://ai-service:8000
      - Cors__AllowedOrigins=http://localhost:8081
      - Seed__AdminEmail=admin@example.com
      - Seed__AdminPassword=Admin12345!
    ports:
      - "5195:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mediconnect-frontend
    depends_on:
      - monolith
      - ai-service
    environment:
      - VITE_API_URL=/api
      - API_URL_SSR=http://monolith:8080/api
      - API_PROXY_TARGET=http://monolith:8080
    ports:
      - "8081:8080"

  ai-service:
    build:
      context: ../microservices/ai-service
      dockerfile: Dockerfile
    container_name: mediconnect-ai-service
    restart: on-failure
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-local}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in docker/.env}
      - CORS_ORIGINS=http://localhost:8081
      - CHROMA_DB_DIR=/app/db_data
      - FASTEMBED_CACHE_DIR=/app/fastembed_cache
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=150
      - MAX_FILE_SIZE_MB=10
    volumes:
      - chromadb_data:/app/db_data
      - fastembed_cache:/app/fastembed_cache
    ports:
      - "5198:8000"

volumes:
  postgres_data:
  chromadb_data:
  fastembed_cache:
